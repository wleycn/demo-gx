storage:
  base_path: "./data/prod"      # environment root
  input_subpath: "input"      # inbound drop location
  input_file: "sample_data.json"   # default input when --input is omitted
  output_subpath: "output"    # everything the pipeline writes
  bronze_subpath: "bronze"
  silver_subpath: "silver"
  gold_subpath: "gold"
  errors_subpath: "errors"

logging:
  level: "INFO"
  file: "logs/pipeline.log"

metrics:
  output_file: "metrics.json"

alert:
  slack_webhook: ""  # left empty; only configured in production
