storage:
  base_path: "./data/dev"      # environment root
  input_subpath: "input"      # inbound drop location
  input_file: "sample_data.json"   # default input when --input is omitted
  output_subpath: "output"    # everything the pipeline writes
  bronze_subpath: "bronze"
  silver_subpath: "silver"
  gold_subpath: "gold"
  errors_subpath: "errors"

logging:
  level: "INFO"
  file: "logs/pipeline.log"

metrics:
  output_file: "metrics.json"

alert:
  slack_webhook: ""  # left empty; only configured in production

pii:
  # Columns replaced by a keyed digest at the ingestion boundary, before the
  # _raw_json audit copy is built (AGENTS.md section 3 red line 4).
  masked_fields: ["customer_id"]
  # HMAC key for the mask digest. Empty in the demo; a real deployment injects
  # it from the secret store rather than committing it.
  pepper: ""
