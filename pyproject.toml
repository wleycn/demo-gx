[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-gx"
version = "1.0.0"
description = "Pandas single-machine lakehouse reference implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The package is installable (`pip install -e .`), which is the primary path.
# This entry is the zero-install fallback so `pytest` works from a bare clone.
pythonpath = ["src"]
testpaths = ["tests"]
