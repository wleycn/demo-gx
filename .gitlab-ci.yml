# demo-gx CI pipeline (GitLab CI skeleton)
# Stages mirror docs/business/PROJECT.md section 9: test → data-quality → promote.
# A real deployment would add environment secrets and storage config.

stages:
  - test
  - data-quality
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

unit-test:
  stage: test
  image: python:3.11
  before_script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -e ".[dev]"
  script:
    - python -m pytest tests/ -v

data-quality:
  stage: data-quality
  image: python:3.11
  before_script:
    - pip install --cache-dir "$PIP_CACHE_DIR" -e ".[dev]"
  script:
    # End-to-end smoke: generate sample data and run the pipeline (test env)
    - python scripts/generate_sample_data.py --env test
    - python -m demo_gx.cli --env test
    # Assertions: a regression that quarantines everything must fail CI
    - python -c "import json; m=json.load(open('data/test/output/metrics.json')); assert m['valid_rows']>0, 'no valid rows survived validation'; print('valid_rows', m['valid_rows'])"
    - python -c "import glob; assert glob.glob('data/test/output/gold/fact_daily_events/event_date=*/data.parquet'), 'gold fact table missing'; print('gold ok')"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

promote:
  stage: deploy
  image: python:3.11
  script:
    - echo "Controlled promotion gate: dev -> test -> prod (manual trigger)."
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
